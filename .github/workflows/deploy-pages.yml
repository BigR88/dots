# Veröffentlicht die Web-Demo bei jedem Push auf main unter
# https://bigr88.github.io/dots — Demo-Modus (Fixtures, ohne Login).
# Einmalig nötig: Repo → Settings → Pages → Source: „GitHub Actions".
name: Deploy Web-Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deploys gleichzeitig; laufende werden vom neueren abgelöst.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web-Export (Expo, Basis-Pfad /dots)
        working-directory: apps/mobile
        env:
          # Schaltet in app.config.js/+html.tsx den Pages-Unterpfad /dots frei.
          DOTS_PAGES: '1'
          # Kein Supabase-Env → Demo-Modus (Fixtures, ohne Login-Gate). Der
          # frühere AUTH_DISABLED-Schalter greift ohnehin nur noch in Dev-Builds.
        run: npx expo export -p web
      - name: SPA-Fallback für tiefe Links
        # Pages liefert für unbekannte Pfade 404.html aus — mit der index.html
        # als Fallback übernimmt der Expo-Router client-seitig das Routing.
        run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
